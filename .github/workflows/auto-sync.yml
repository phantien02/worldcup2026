name: Auto Sync Scores

on:
  push:
    branches:
      - main
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call Sync API
        run: |
          echo "Triggering Vercel Sync API..."
          curl -X GET "https://worldcup2026-kappa-lake.vercel.app/api/cron/sync-scores?secret=AutoSync2026_Secret999"
          echo "Done!"
