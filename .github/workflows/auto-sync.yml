name: Auto Sync Scores

on:
  push:
    branches:
      - main
  schedule:
    # Run every 15 minutes to check for finished match results (saves Gemini API quota)
    - cron: '*/15 * * * *'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call Sync API
        run: |
          echo "Triggering Vercel Sync API..."
          curl -X GET "https://worldcup2026-kappa-lake.vercel.app/api/live" -H "Accept: application/json"
          echo "API triggered successfully!"

