name: Auto Sync Scores

on:
  push:
    branches:
      - main
  schedule:
    # Run every 5 minutes for livescore
    - cron: '*/5 * * * *'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call Sync API
        run: |
          echo "Installing Playwright..."
          npm install playwright
          npx playwright install chromium
          echo "Triggering Vercel Sync API via headless browser..."
          node -e "const { chromium } = require('playwright'); (async () => { const browser = await chromium.launch(); const page = await browser.newPage(); console.log('Opening page...'); await page.goto('https://worldcup2026-kappa-lake.vercel.app/api/cron/sync-scores?secret=AutoSync2026_Secret999'); console.log('Waiting 15s for JS challenge...'); await page.waitForTimeout(15000); console.log('Bypassed JS challenge and executed API successfully!'); await browser.close(); })();"
