name: Auto Sync Scores

on:
  push:
    branches:
      - main
  schedule:
    # Tránh các phút 0, 15, 30, 45 để né giờ cao điểm của GitHub Actions toàn cầu
    - cron: '7,22,37,52 * * * *'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call Sync API
        run: |
          echo "Triggering Vercel Sync API..."
          curl -X GET "https://worldcup2026-kappa-lake.vercel.app/api/live" -H "Accept: application/json"
          echo "API triggered successfully!"

